<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日英语学习工作台</title>
<style>
  :root{
    --primary:#4F6DF5; --primary-soft:#EDF0FE; --primary-dark:#3B52CC;
    --success:#16A34A; --success-soft:#EAF7EF;
    --warn:#EA8A00; --warn-soft:#FFF4E3;
    --danger:#E5484D; --danger-soft:#FDECED;
    --ink:#1F2430; --ink-2:#5A6272; --ink-3:#8A93A6;
    --bg:#F4F6FB; --card:#FFFFFF; --line:#E7EAF3;
    --radius:16px; --shadow:0 1px 3px rgba(31,36,48,.06),0 8px 24px -12px rgba(31,36,48,.12);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
  svg{display:block}

  /* ===== Header ===== */
  .header{background:linear-gradient(135deg,#4F6DF5 0%,#6C5CE7 100%);color:#fff;padding:26px 20px 22px}
  .header-inner{max-width:960px;margin:0 auto}
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{width:44px;height:44px;background:rgba(255,255,255,.16);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-logo svg{width:24px;height:24px}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand p{font-size:12.5px;opacity:.85;margin-top:1px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .tool-btn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:600;transition:background .2s}
  .tool-btn:hover{background:rgba(255,255,255,.24)}
  .tool-btn svg{width:17px;height:17px}
  .tool-btn.danger{background:rgba(229,72,77,.32)}
  .today-strip{max-width:960px;margin:16px auto 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .today-strip .ts-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .today-strip .ts-icon svg{width:20px;height:20px}
  .today-strip .ts-main{flex:1;min-width:180px}
  .today-strip .ts-title{font-size:14px;font-weight:700}
  .today-strip .ts-sub{font-size:12px;opacity:.85}
  .ts-actions{display:flex;gap:8px}

  /* ===== Layout ===== */
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0}
  .card-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
  .card-title .ci{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .card-title .ci svg{width:18px;height:18px}
  .card-title small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
  .card-body{padding:16px 20px 20px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .badge svg{width:12px;height:12px}

  /* ===== 今日要处理 ===== */
  .todo-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
  .todo-item:last-child{margin-bottom:0}
  .todo-item .t-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .todo-item .t-icon svg{width:19px;height:19px}
  .todo-item .t-main{flex:1;min-width:0}
  .todo-item .t-title{font-size:14px;font-weight:700}
  .todo-item .t-sub{font-size:12.5px;color:var(--ink-3)}
  .todo-item.overdue{border-color:#F5C2C4;background:var(--danger-soft)}
  .todo-item.overdue .t-title{color:var(--danger)}
  .t-go{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;transition:opacity .2s}
  .t-go:hover{opacity:.85}
  .t-go svg{width:15px;height:15px}
  .all-done{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;text-align:center}
  .all-done .ad-icon{width:52px;height:52px;border-radius:50%;background:var(--success-soft);display:flex;align-items:center;justify-content:center}
  .all-done .ad-icon svg{width:26px;height:26px;color:var(--success)}
  .all-done b{font-size:15px}
  .all-done span{font-size:13px;color:var(--ink-3)}

  /* ===== 主题 ===== */
  .theme-hero{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(160deg,#F8FAFF,#fff)}
  .theme-tag-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .theme-name{font-size:22px;font-weight:800}
  .theme-desc{font-size:13.5px;color:var(--ink-2);margin-bottom:12px}
  .theme-words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .word-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--primary-dark);background:var(--primary-soft);padding:5px 12px;border-radius:999px}
  .word-chip svg{width:12px;height:12px}
  .theme-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:700;transition:filter .2s,transform .05s}
  .btn:active{transform:scale(.97)}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-soft{background:var(--primary-soft);color:var(--primary-dark)}
  .btn-soft:hover{background:#E2E7FD}
  .btn-outline{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
  .btn-outline:hover{background:#F7F8FC}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line);height:40px;font-size:13px;font-weight:600}

  /* ===== 单词 ===== */
  .word-item{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff;transition:border-color .2s}
  .word-item:last-child{margin-bottom:0}
  .word-item.done{border-color:#BFE3CD;background:#FBFFFD}
  .word-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-size:21px;font-weight:800;letter-spacing:.3px}
  .word-phonetic{font-size:14px;color:var(--ink-3);font-style:italic}
  .word-pos{font-size:12px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:2px 9px;border-radius:6px}
  .word-cn{font-size:14.5px;color:var(--ink-2);margin:8px 0 4px;font-weight:600}
  .word-en{font-size:13px;color:var(--ink-3);line-height:1.7}
  .word-ex{margin-top:10px;background:#F8FAFF;border-radius:10px;padding:10px 12px}
  .word-ex .ex{font-size:13.5px;line-height:1.75}
  .word-ex .ex + .ex{margin-top:6px}
  .ex-en{color:var(--ink)}
  .ex-cn{color:var(--ink-3);font-size:12.5px;display:block;margin-top:1px}
  .word-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
  .status-badge svg{width:13px;height:13px}
  .st-new{background:#F1F3F9;color:var(--ink-3)}
  .st-learning{background:var(--warn-soft);color:var(--warn)}
  .st-mastered{background:var(--success-soft);color:var(--success)}
  .word-ops{display:flex;gap:8px}
  .mini-btn{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:all .15s}
  .mini-btn svg{width:14px;height:14px}
  .mini-btn:hover{border-color:var(--primary);color:var(--primary)}
  .mini-btn.ok:hover{border-color:var(--success);color:var(--success);background:var(--success-soft)}
  .word-count{font-size:13px;color:var(--ink-3);font-weight:600}

  /* ===== 观点表达 ===== */
  .topic-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-2)}
  .tab svg{width:15px;height:15px}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.late{color:var(--danger);border-color:#F5C2C4}
  .tab.late.active{background:var(--danger);border-color:var(--danger);color:#fff}
  .q-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#FBFCFE}
  .q-card .q-num{font-size:12px;font-weight:800;color:var(--primary);letter-spacing:1px;margin-bottom:4px}
  .q-card .q-text{font-size:15px;font-weight:700;line-height:1.6}
  .struc-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .struc-cell{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:#fff}
  .struc-cell .s-step{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--primary)}
  .struc-cell .s-en{font-size:11.5px;color:var(--ink-3)}
  .struc-cell.arrow{display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--ink-3);padding:0}
  .struc-cell.arrow svg{width:18px;height:18px}
  .field{margin-bottom:14px}
  .field label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-bottom:7px}
  .field label svg{width:15px;height:15px;color:var(--primary)}
  .field .hint{font-size:12px;color:var(--ink-3);margin-left:auto;font-weight:500}
  textarea{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;line-height:1.7;background:#fff;transition:border-color .2s}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .submit-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filled-note{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--success)}

  /* ===== 进度 ===== */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .stat .s-num{font-size:24px;font-weight:800;line-height:1.2}
  .stat .s-label{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:3px}
  .stat .s-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .stat .s-ico svg{width:16px;height:16px}
  .prog-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;margin-bottom:18px}
  .ring-wrap{position:relative;width:112px;height:112px;flex-shrink:0}
  .ring-wrap svg{width:112px;height:112px;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:#EFF1F8;stroke-width:10}
  .ring-fg{fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-center b{font-size:22px;font-weight:800}
  .ring-center span{font-size:10.5px;color:var(--ink-3);font-weight:600}
  .prog-detail{flex:1;min-width:220px}
  .prog-line{margin-bottom:12px}
  .prog-line:last-child{margin-bottom:0}
  .prog-line .pl-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
  .prog-line .pl-head .pct{color:var(--primary);font-weight:800}
  .pbar{height:8px;background:#EFF1F8;border-radius:99px;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#4F6DF5,#6C5CE7);border-radius:99px;transition:width .5s ease}
  .heat-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .heat{display:flex;flex-direction:column;align-items:center;gap:5px}
  .heat .h-label{font-size:10.5px;color:var(--ink-3);font-weight:600}
  .heat .h-cell{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
  .heat .h-cell.off{background:#EEF0F7;color:var(--ink-3)}
  .history-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .his-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
  .his-row:last-child{border-bottom:none}
  .his-date{font-size:12px;font-weight:700;color:var(--ink-3);width:88px;flex-shrink:0}
  .his-theme{font-size:13.5px;font-weight:700;flex:1}
  .his-theme small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .his-words{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .his-status{flex-shrink:0}
  .empty-tip{text-align:center;padding:26px 16px;color:var(--ink-3);font-size:13.5px}

  /* ===== Toast & Modal ===== */
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#22283A;color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:10px;z-index:99;transition:transform .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:88vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .mask{position:fixed;inset:0;background:rgba(20,24,38,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.22);max-height:86vh;overflow-y:auto}
  .modal h3{display:flex;align-items:center;gap:9px;font-size:16.5px;margin-bottom:6px}
  .modal h3 svg{width:19px;height:19px;color:var(--primary)}
  .modal .m-desc{font-size:13px;color:var(--ink-3);margin-bottom:16px}
  .modal .m-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .radio-pill{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:#fff}
  .radio-pill input{width:16px;height:16px;accent-color:var(--primary)}
  .radio-pill.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark)}
  .sel-wrap{position:relative;flex:1;min-width:150px}
  .sel-wrap select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 34px 0 12px;background:#fff;appearance:none;-webkit-appearance:none;font-size:15px;font-weight:600}
  .sel-wrap svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;pointer-events:none;color:var(--ink-3)}
  .m-actions{display:flex;gap:10px;margin-top:18px}
  .m-actions .btn{flex:1}
  .m-warn{background:var(--danger-soft);border:1px solid #F5C2C4;color:var(--danger);font-size:13px;font-weight:600;border-radius:10px;padding:12px 14px;display:flex;gap:9px;align-items:flex-start}
  .m-warn svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
  .danger-zone{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
  .danger-zone h4{font-size:13.5px;font-weight:700;margin-bottom:4px}
  .danger-zone p{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}

  .footer{text-align:center;font-size:12px;color:var(--ink-3);padding:8px 16px 20px}

  /* ===== 响应式 ===== */
  @media (max-width:768px){
    .header{padding:20px 16px 18px}
    .brand h1{font-size:18px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .prog-row{flex-direction:column;align-items:flex-start}
    .ring-wrap{align-self:center}
    .struc-bar{grid-template-columns:1fr}
    .struc-cell.arrow{display:none}
    .theme-name{font-size:19px}
    .card-head{padding:16px 16px 0}
    .card-body{padding:14px 16px 18px}
    .his-words{display:none}
    .t-go{height:44px}
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">
        <div class="brand-logo" id="brandLogo"></div>
        <div>
          <h1>每日英语学习工作台</h1>
          <p id="headerDate"></p>
        </div>
      </div>
      <div class="tools">
        <button class="tool-btn" id="btnExport" title="导出 JSON 备份"><span id="icExport"></span>导出备份</button>
        <button class="tool-btn" id="btnImport" title="从 JSON 恢复"><span id="icImport"></span>导入恢复</button>
        <input type="file" id="fileImport" accept="application/json,.json" style="display:none">
        <button class="tool-btn danger" id="btnClearSample" title="移除预置示例数据"><span id="icErase"></span>清空示例</button>
      </div>
    </div>
    <div class="today-strip">
      <div class="ts-icon" id="tsIcon"></div>
      <div class="ts-main">
        <div class="ts-title" id="tsTitle"></div>
        <div class="ts-sub" id="tsSub"></div>
      </div>
      <div class="ts-actions">
        <button class="btn btn-primary" id="btnGoToday" style="height:40px;font-size:13px;padding:0 16px"><span id="icPlay"></span>开始学习</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 今日要处理 -->
  <section class="card" id="todayCard">
    <div class="card-head">
      <div class="card-title"><span class="ci" style="background:var(--danger-soft);color:var(--danger)" id="todayIcon"></span>今天要处理</div>
      <span class="badge" id="todayBadge" style="background:#F1F3F9;color:var(--ink-3)">加载中</span>
    </div>
    <div class="card-body" id="todayList"></div>
  </section>

  <!-- 主题化学习 -->
  <section class="card" id="themeCard">
    <div class="card-head">
      <div class="card-title"><span class="ci" style="background:var(--primary-soft);color:var(--primary)" id="themeIcon"></span>今日主题<small>主题化学习</small></div>
      <button class="btn-ghost" id="btnThemeSet" style="height:40px"><span id="icGear"></span>主题设置</button>
    </div>
    <div class="card-body" id="themeBody"></div>
  </section>

  <!-- 每日单词 -->
  <section class="card" id="wordCard">
    <div class="card-head">
      <div class="card-title"><span class="ci" style="background:var(--success-soft);color:var(--success)" id="wordIcon"></span>每日单词<small>今日 5 词 · 与主题联动</small></div>
      <span class="word-count" id="wordCount"></span>
    </div>
    <div class="card-body" id="wordList"></div>
  </section>

  <!-- 观点表达 -->
  <section class="card" id="speakCard">
    <div class="card-head">
      <div class="card-title"><span class="ci" style="background:var(--warn-soft);color:var(--warn)" id="speakIcon"></span>观点表达练习<small>观点 → 理由 → 例子</small></div>
    </div>
    <div class="card-body" id="speakBody"></div>
  </section>

  <!-- 反馈与跟踪 -->
  <section class="card" id="progCard">
    <div class="card-head">
      <div class="card-title"><span class="ci" style="background:#F3E8FF;color:#9333EA" id="progIcon"></span>学习进度<small>反馈与跟踪</small></div>
    </div>

/* ---------- 工具函数 ---------- */
const $ = id => document.getElementById(id);
function dateKey(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
function todayKey(){ return dateKey(new Date()); }
function addDays(key,n){ const d=new Date(key+'T00:00:00'); d.setDate(d.getDate()+n); return dateKey(d); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtCN(key){ const d=new Date(key+'T00:00:00'); const wd=['日','一','二','三','四','五','六'][d.getDay()]; return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd; }

/* ---------- 数据层（localStorage） ---------- */
const KEY='wb_enstudy_v1';
let state = null;

function defaultState(){ return {
  config:{ rotation:'auto', manualTheme:'life' },
  wordLog:[],   // {date, themeId, items:[{word,status}]}  status: new|learning|mastered
  topicLog:[],  // {date, themeId, answers:{v,r,e}, submitted, submittedAt}
  seeded:false
};}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('保存失败：存储空间不足'); } }
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(d && d.wordLog && d.topicLog && d.config) return d; } }catch(e){}
  return null;
}

/* ---------- 主题与每日任务生成 ---------- */
function themeForDate(key, config){
  if(config.rotation==='manual') return themeById(config.manualTheme);
  const dayNum = Math.floor(new Date(key+'T00:00:00').getTime()/86400000);
  return THEMES[Math.abs(dayNum) % THEMES.length];
}
function learnedWordsSet(){ const s=new Set(); state.wordLog.forEach(r=>r.items.forEach(i=>s.add(i.word))); return s; }

function ensureToday(){
  const tk = todayKey(), cfg = state.config;
  // 主题
  if(!state.topicLog.some(r=>r.date===tk)){
    const th = themeForDate(tk, cfg);
    state.topicLog.push({date:tk, themeId:th.id, answers:{v:'',r:'',e:''}, submitted:false, submittedAt:null});
  }
  // 单词
  if(!state.wordLog.some(r=>r.date===tk)){
    const th = themeForDate(tk, cfg);
    const learned = learnedWordsSet();
    let picked = [];
    // 1) 本主题未学过的
    WORDBANK[th.id].filter(x=>!learned.has(x.w)).forEach(x=>{ if(picked.length<5) picked.push(x.w); });
    // 2) 其他主题未学过的
    if(picked.length<5){ THEMES.forEach(t=>{ if(t.id!==th.id && picked.length<5){ WORDBANK[t.id].forEach(x=>{ if(!learned.has(x.w) && picked.length<5) picked.push(x.w); }); } }); }
    // 3) 复习已学过的
    if(picked.length<5){
      const all = THEMES.reduce((a,t)=>a.concat(WORDBANK[t.id]),[]);
      const rest = all.map(x=>x.w).filter(w=>!picked.includes(w));
      while(picked.length<5 && rest.length) picked.push(rest.shift());
    }
    state.wordLog.push({date:tk, themeId:th.id, items:picked.map(w=>({word:w,status:'new'}))});
  }
}

function seedSamples(){
  if(state.seeded) return;
  const yk = addDays(todayKey(), -1);

  // 昨天主题练习：未提交 → 逾期
  if(!state.topicLog.some(r=>r.date===yk)) state.topicLog.push({date:yk, themeId:th.id, answers:{v:'',r:'',e:''}, submitted:false, submittedAt:null});
  // 昨天 3 个单词示例
  if(!state.wordLog.some(r=>r.date===yk)){

    state.wordLog.push({date:yk, themeId:th.id, items:sample});
  }

}

/* ---------- 渲染：学习进度 ---------- */
function renderProgress(){
  const tk=todayKey();
  const body=$('progBody');
  const wordRecs=state.wordLog;
  const topicRecs=state.topicLog;

  const allItems=wordRecs.reduce((a,r)=>a.concat(r.items.map(i=>({word:i.word,status:i.status,date:r.date}))),[]);
  const learned=allItems.filter(i=>i.status!=='new').length;
  const mastered=allItems.filter(i=>i.status==='mastered').length;
  const totalUnique=new Set(allItems.map(i=>i.word)).size;
  const topicsDone=topicRecs.filter(r=>r.submitted).length;
  const totalTopics=new Set(topicRecs.map(r=>r.date)).size||1;

  // 连续天数（从今天向前，有活动记录的天）
  let streak=0; let cursor=tk;
  while(true){
    const hasDay=wordRecs.some(r=>r.date===cursor && r.items.some(i=>i.status!=='new')) || topicRecs.some(r=>r.date===cursor && r.submitted);
    if(hasDay){ streak++; cursor=addDays(cursor,-1); } else break;
  }

  // 今日完成度
  const tw=wordRecs.find(r=>r.date===tk);
  const tt=topicRecs.find(r=>r.date===tk);
  const wDone=tw?tw.items.filter(i=>i.status!=='new').length/tw.items.length:0;
  const tDone=tt&&tt.submitted?1:0;
  const dayPct=Math.round((wDone*0.5 + tDone*0.5)*100);

  // 最近 7 天热力
  let heatHTML='';
  for(let i=6;i>=0;i--){
    const dk=addDays(tk,-i);
    const hw=wordRecs.find(r=>r.date===dk); const ht=topicRecs.find(r=>r.date===dk);
    let level=0;
    if(hw||ht){
      const hwd=hw?hw.items.filter(x=>x.status!=='new').length/hw.items.length:0;
      const htd=ht&&ht.submitted?1:0;
      level=Math.round((hwd*0.5+htd*0.5)*10); // 0-10
    }
    const cellColor = level===0 ? '#EEF0F7' : level<=3 ? '#C7D2FE' : level<=6 ? '#818CF8' : '#4F6DF5';
    heatHTML += `<div class="heat"><span class="h-label">${fmtCN(dk).slice(0,2)}</span><div class="h-cell" style="background:${cellColor};color:${level===0?'var(--ink-3)':'#fff'}">${level===0?'·':level}</div></div>`;
  }

  const ringC=2*Math.PI*52, ringOff=ringC*(1-dayPct/100);

  // 历史记录
  const hist=wordRecs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const histHTML=hist.length?hist.map(r=>{
    const th=themeById(r.themeId);
    const doneN=r.items.filter(i=>i.status!=='new').length;
    const tRec=topicRecs.find(t=>t.date===r.date);
    const sub=tRec&&tRec.submitted;
    const statusTxt = sub?'<span class="badge" style="background:#EAF7EF;color:#16A34A">'+icon('check')+'练习已交</span>'
                    : (r.date<tk?'<span class="badge" style="background:#FDECED;color:#E5484D">'+icon('alert')+'练习逾期</span>'
                              :'<span class="badge" style="background:#FFF4E3;color:#EA8A00">'+icon('clock')+'待完成</span>');
    return `<div class="his-row">
      <div class="his-date">${esc(r.date)}</div>
      <div class="his-theme">${esc(th.name)}主题<small>${esc(fmtCN(r.date))}</small></div>
      <div class="his-words">${doneN}/${r.items.length} 词已学</div>
      <div class="his-status">${statusTxt}</div>
    </div>`;
  }).join('') : '<div class="empty-tip">还没有学习记录，从今天开始吧！</div>';

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="s-ico" style="background:var(--success-soft);color:var(--success)">${icon('book')}</div><div class="s-num">${learned}</div><div class="s-label">已学单词</div></div>
      <div class="stat"><div class="s-ico" style="background:#EDF0FE;color:#4F6DF5">${icon('award')}</div><div class="s-num">${mastered}</div><div class="s-label">已掌握</div></div>
      <div class="stat"><div class="s-ico" style="background:#F3E8FF;color:#9333EA">${icon('flag')}</div><div class="s-num">${topicsDone}/${totalTopics}</div><div class="s-label">主题完成</div></div>
      <div class="stat"><div class="s-ico" style="background:var(--warn-soft);color:var(--warn)">${icon('trending')}</div><div class="s-num">${streak}</div><div class="s-label">连续天数</div></div>
    </div>
    <div class="prog-row">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" cx="60" cy="60" r="52" stroke-dasharray="${ringC.toFixed(1)}" stroke-dashoffset="${ringOff.toFixed(1)}"/>
        </svg>
        <div class="ring-center"><b>${dayPct}%</b><span>今日完成度</span></div>
      </div>
      <div class="prog-detail">
        <div class="prog-line"><div class="pl-head"><span>今日单词</span><span class="pct">${Math.round(wDone*100)}%</span></div><div class="pbar"><i style="width:${Math.round(wDone*100)}%"></i></div></div>
        <div class="prog-line"><div class="pl-head"><span>主题练习</span><span class="pct">${Math.round(tDone*100)}%</span></div><div class="pbar"><i style="width:${Math.round(tDone*100)}%"></i></div></div>
        <div class="prog-line"><div class="pl-head"><span>累计词汇 ${totalUnique} 词</span><span class="pct">掌握率 ${totalUnique?Math.round(mastered/Math.max(totalUnique,1)*100):0}%</span></div><div class="pbar"><i style="width:${totalUnique?Math.round(mastered/totalUnique*100):0}%"></i></div></div>
      </div>
    </div>
    <div class="heat-row">${heatHTML}</div>
    <div class="history-list">${histHTML}</div>`;
}

/* ---------- 主题设置 Modal ---------- */
function renderThemeModal(){
  const cfg=state.config;
  const auto=cfg.rotation==='auto';
  $('pillAuto').classList.toggle('active',auto);
  $('pillManual').classList.toggle('active',!auto);
  $('themeSelRow').style.display=auto?'none':'flex';
  const sel=$('selTheme');
  sel.innerHTML=THEMES.map(t=>`<option value="${t.id}" ${t.id===cfg.manualTheme?'selected':''}>${t.name} · ${t.desc.slice(0,14)}…</option>`).join('');
  document.querySelectorAll('input[name="rot"]').forEach(r=>{
    r.checked=(r.value==='auto')===auto;
    r.onchange=()=>{ $('pillAuto').classList.toggle('active',r.value==='auto'); $('pillManual').classList.toggle('active',r.value==='manual'); $('themeSelRow').style.display=r.value==='auto'?'none':'flex'; };
  });
}
$('btnThemeSet').addEventListener('click',()=>{ renderThemeModal(); $('maskTheme').classList.add('show'); });
$('btnThemeCancel').addEventListener('click',()=>$('maskTheme').classList.remove('show'));
$('btnThemeSave').addEventListener('click',()=>{
  const v=document.querySelector('input[name="rot"]:checked').value;
  state.config.rotation=v;
  state.config.manualTheme=$('selTheme').value;
  save();
  $('maskTheme').classList.remove('show');
  ensureToday(); renderAll();
  toast('主题设置已保存');
});

/* ---------- 导出 / 导入 / 清空 ---------- */
$('btnExport').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='英语工作台备份-'+todayKey()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('已导出 JSON 备份');
});
$('btnImport').addEventListener('click',()=>$('fileImport').click());
$('fileImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d.wordLog || !d.topicLog || !d.config) throw new Error('bad');
      state=d; save(); ensureToday(); renderAll();
      toast('导入成功，已恢复 '+state.wordLog.length+' 天记录');
    }catch(err){ toast('导入失败：文件格式不正确'); }
    e.target.value='';
  };
  reader.readAsText(f);
});

/* 清空示例数据（二次确认） */
let confirmAction=null;
function askConfirm(title,iconName,desc,act){
  $('cfIcon').innerHTML=icon(iconName);
  $('cfWarn').textContent=title;
  $('cfDesc').textContent=desc;
  confirmAction=act;
  $('maskConfirm').classList.add('show');
}
$('cfCancel').addEventListener('click',()=>$('maskConfirm').classList.remove('show'));
$('cfOk').addEventListener('click',()=>{
  $('maskConfirm').classList.remove('show');
  if(confirmAction){ confirmAction(); confirmAction=null; }
});
$('btnClearSample').addEventListener('click',()=>{
  askConfirm('确定清空示例数据？','alert','将移除预置的示例学习记录（昨天的那几条演示数据），今天的任务不受影响。','clearSample');
});
function clearSample(){
  const tk=todayKey();
  state.wordLog=state.wordLog.filter(r=>r.date===tk);
  state.topicLog=state.topicLog.filter(r=>r.date===tk);
  save(); renderAll();
  toast('示例数据已清空');
}
$('btnWipe').addEventListener('click',()=>{
  askConfirm('确定清空全部数据？','alert','将删除所有学习记录与设置（无法撤销）。建议先点击顶部「导出备份」留存数据。','wipeAll');
});
function wipeAll(){
  state=defaultState(); state.seeded=true;
  save(); ensureToday(); renderAll();
  toast('已清空全部数据');
}

/* ---------- 滚动 / Toast ---------- */
function scrollTo(id){ const el=$(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- 主入口 ---------- */
function renderAll(){
  renderToday(); renderTheme(); renderWords(); renderSpeak(); renderProgress();
  $('headerDate').textContent=fmtCN(todayKey())+' · 坚持每天一点点';
  const d=themeById((state.topicLog.find(r=>r.date===todayKey())||{}).themeId||'life');
  $('tsIcon').innerHTML=icon(d.icon);
  ['todayIcon','themeIcon','wordIcon','speakIcon','progIcon'].forEach((id,i)=>{
    const map=[['alert','#E5484D','#FDECED'],['sun',d.color,d.soft],['book','#16A34A','#EAF7EF'],['chat','#EA8A00','#FFF4E3'],['chart','#9333EA','#F3E8FF']];
    const el=$(id); if(el){ el.style.background=map[i][2]; el.style.color=map[i][1]; el.innerHTML=icon(map[i][0]); }
  });
  // 数据积累提示
  const total=state.wordLog.length;
  if(total>=30 && !sessionStorage.getItem('wb_backup_tip')){
    sessionStorage.setItem('wb_backup_tip','1');
    setTimeout(()=>toast('数据已积累 '+total+' 天，建议导出备份'),600);
  }
}
$('btnGoToday').addEventListener('click',()=>{ scrollTo('wordCard'); });

(function init(){
  const s=load();
  if(s){ state=s; }
  else{ state=defaultState(); seedSamples(); save(); }
  ensureToday(); save();
  renderAll();
})();
</script>
</body>
